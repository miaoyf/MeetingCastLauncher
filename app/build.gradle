plugins {
    id 'com.android.application'
}

android {
    namespace 'com.company.meetingcast'
    compileSdk 34

    defaultConfig {
        applicationId 'com.company.meetingcast'
        minSdk 23
        targetSdk 28
        versionCode 11
        versionName '1.3.7'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
